<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>London Monopoly Challenges</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti for celebrations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">

    <!-- Sticky Scoreboard Banner -->
    <header class="sticky top-0 z-40 bg-white shadow-md flex justify-between items-center p-4">
        <!-- Blue Team Score -->
        <div class="flex flex-col items-center w-1/3 text-blue-600">
            <h2 class="text-lg font-bold uppercase tracking-wider">Blue Team</h2>
        </div>

        <!-- Main Center Scores -->
        <div class="flex flex-col items-center w-1/3">
            <div class="text-3xl font-black flex space-x-2">
                <span id="score-money-blue" class="text-blue-600">£0</span>
                <span class="text-gray-400">-</span>
                <span id="score-money-yellow" class="text-yellow-500">£0</span>
            </div>
            <div class="text-xs font-semibold text-gray-500 mt-1 uppercase">Properties Captured</div>
            <div class="text-sm font-bold flex space-x-2">
                <span id="score-props-blue" class="text-blue-600">0</span>
                <span class="text-gray-400">-</span>
                <span id="score-props-yellow" class="text-yellow-500">0</span>
            </div>
        </div>

        <!-- Yellow Team Score -->
        <div class="flex flex-col items-center w-1/3 text-yellow-500">
            <h2 class="text-lg font-bold uppercase tracking-wider">Yellow Team</h2>
        </div>
    </header>

    <!-- Main Content Area: Dropdowns -->
    <main id="property-container" class="p-4 max-w-lg mx-auto pb-20">
        <!-- Dropdowns will be injected here by JavaScript -->
    </main>

    <!-- Overlay Modal for Property Card -->
    <div id="card-modal" class="fixed inset-0 bg-black bg-opacity-70 z-50 hidden flex justify-center items-center p-4 opacity-0 transition-opacity duration-300">
        <!-- Close trigger background -->
        <div class="absolute inset-0" onclick="closeModal()"></div>
        
        <!-- 3D Scene container -->
        <div class="scene w-full max-w-sm h-96 z-10 relative">
            <div id="flip-card" class="card w-full h-full cursor-pointer">
                
                <!-- Card Front (Back of the Monopoly card before flip) -->
                <div class="card-face card-front bg-red-600 rounded-xl border-4 border-white shadow-2xl flex items-center justify-center">
                    <h2 class="text-4xl text-white font-black rotate-[-15deg] font-serif">MONOPOLY</h2>
                    <button onclick="closeModal()" class="absolute top-3 right-4 text-white text-2xl font-bold">&times;</button>
                </div>

                <!-- Card Back (The actual property details) -->
                <div class="card-face card-back bg-white rounded-xl shadow-2xl flex flex-col overflow-hidden">
                    <button onclick="closeModal()" class="absolute top-2 right-3 text-gray-800 text-2xl font-bold z-10">&times;</button>
                    
                    <!-- Top Color Header -->
                    <div id="modal-color-header" class="h-24 flex items-center justify-center border-b-2 border-black m-2">
                        <h2 id="modal-prop-name" class="text-2xl font-black text-center uppercase px-4">Property Name</h2>
                    </div>
                    
                    <!-- Challenge Info -->
                    <div class="flex-grow p-4 flex flex-col items-center justify-center text-center">
                        <h3 id="modal-challenge-name" class="text-lg font-bold text-gray-700 mb-2">Challenge Name</h3>
                        <p id="modal-challenge-desc" class="text-sm text-gray-600 italic">Challenge description goes here...</p>
                    </div>

                    <!-- Claim Buttons -->
                    <div id="modal-actions" class="p-4 grid grid-cols-2 gap-4">
                        <button onclick="claimProperty('blue')" class="bg-blue-600 active:bg-blue-800 text-white font-bold py-3 rounded-lg shadow-md transition transform active:scale-95">Claim Blue</button>
                        <button onclick="claimProperty('yellow')" class="bg-yellow-400 active:bg-yellow-600 text-gray-900 font-bold py-3 rounded-lg shadow-md transition transform active:scale-95">Claim Yellow</button>
                    </div>

                    <!-- Property Value -->
                    <div class="bg-gray-100 py-3 text-center border-t border-gray-200">
                        <span class="text-lg font-bold text-gray-800">Value: £<span id="modal-prop-value">0</span></span>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Celebration Toast Message -->
    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl font-bold z-50 translate-y-20 opacity-0 transition-all duration-500 pointer-events-none">
        Message
    </div>

    <script src="app.js"></script>
</body>
</html>
